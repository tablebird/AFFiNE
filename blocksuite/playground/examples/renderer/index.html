<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Renderer Example</title>
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
        margin: 0;
        padding: 0;
        background-color: var(--affine-white-90);
        transition: background-color 0.3s;
      }

      #container {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .top-bar {
        position: absolute;
        top: 0;
        right: 0;
        padding: 5px;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div class="top-bar">
        <div id="tweakpane-container"></div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
